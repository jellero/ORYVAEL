services:
  oryvael:
    build:
      context: .
      target: runtime
    image: oryvael:dev
    hostname: oryvael
    privileged: true
    volumes:
      - oryvael-state:/var/lib/oryvael
      - oryvael-workspace:/workspace
    tmpfs:
      - /run:rw,nosuid,nodev,mode=0755
      - /tmp:rw,nosuid,nodev,exec,size=256m
    restart: unless-stopped
    stop_grace_period: 5s

volumes:
  oryvael-state:
  oryvael-workspace:
