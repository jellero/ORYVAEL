[package]
name = "oryvael-kernel"
version = "0.0.2"
edition = "2024"
publish = false
autobins = false

# Keep the bare-metal kernel isolated from the host-side trusted-core workspace.
[workspace]

[[bin]]
name = "oryvael-kernel"
path = "src/stage2_main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
embedded-io-async = { version = "0.6", default-features = false }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
zssh = { version = "0.4.2", default-features = false }
