[workspace]
resolver = "2"
members = [
  "crates/oryvael-protocol",
  "crates/oryvael-policy",
  "crates/oryvael-audit",
  "crates/oryvael-arch",
  "crates/oryvael-supervisor",
  "crates/oryvael-tool-broker",
  "crates/oryvael-proof",
  "crates/oryvael-workspace",
  "crates/oryvael-evidence",
  "crates/oryvael-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
