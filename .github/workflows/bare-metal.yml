name: Bare Metal OS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install host-side image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dosfstools \
            mtools \
            ovmf \
            qemu-system-x86

      - name: Build ORYVAEL bare-metal image
        run: ./scripts/build-os.sh

      - name: Boot ORYVAEL and verify minimal kernel services
        shell: bash
        run: |
          set +e
          {
            sleep 3
            printf 'help\r'
            sleep 0.2
            printf 'mem\r'
            sleep 0.2
            printf 'alloc\r'
            sleep 0.2
            printf 'uptime\r'
            sleep 0.2
            printf 'about\r'
          } | timeout 12s ./scripts/run-os.sh >boot.log 2>&1
          status=${PIPESTATUS[1]}
          set -e

          cat boot.log

          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "QEMU failed with status $status" >&2
            exit "$status"
          fi

          grep -F "ORYVAEL: firmware boot services detached" boot.log
          grep -F "ORYVAEL: physical allocator online" boot.log
          grep -F "ORYVAEL: kernel heap online" boot.log
          grep -F "ORYVAEL: timer interrupts online hz=100" boot.log
          grep -F "ORYVAEL: minimal system ready" boot.log
          grep -F "commands: help mem uptime alloc clear about reboot" boot.log
          grep -F "memory: conventional_free_pages=" boot.log
          grep -E 'alloc: frame=0x[0-9a-f]+ heap64=0x[0-9a-f]+' boot.log
          grep -E 'uptime: ticks=[1-9][0-9]* seconds=[0-9]+' boot.log
          grep -F "ORYVAEL minimal bare-metal base: native kernel, no Linux substrate" boot.log

      - name: Archive boot image
        uses: actions/upload-artifact@v4
        with:
          name: oryvael-x86_64-uefi
          path: |
            dist/oryvael-x86_64-uefi.img
            dist/BOOTX64.EFI
