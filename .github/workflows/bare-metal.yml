name: Bare Metal OS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install host-side image and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dosfstools \
            mtools \
            ovmf \
            qemu-system-x86

      - name: Build ORYVAEL bare-metal image
        run: ./scripts/build-os.sh

      - name: Boot ORYVAEL and verify native userspace
        shell: bash
        run: |
          set +e
          {
            sleep 5
            printf 'help\r'
            sleep 0.2
            printf 'status\r'
            sleep 0.2
            printf 'debug\r'
            sleep 0.2
            printf 'net\r'
            sleep 0.2
            printf 'ip\r'
            sleep 0.2
            printf 'ping\r'
            sleep 0.2
            printf 'users\r'
            sleep 0.2
            printf 'whoami\r'
            sleep 0.2
            printf 'ssh status\r'
            sleep 0.2
            printf 'version\r'
            sleep 0.2
            printf 'vm\r'
            sleep 0.2
            printf 'ps\r'
            sleep 0.2
            printf 'fs\r'
            sleep 0.2
            printf 'ipc\r'
            sleep 0.2
            printf 'mem\r'
            sleep 0.2
            printf 'uptime\r'
            sleep 0.2
            printf 'about\r'
          } | timeout 30s ./scripts/run-os.sh >boot.log 2>&1
          status=${PIPESTATUS[1]}
          set -e

          cat boot.log

          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "QEMU failed with status $status" >&2
            exit "$status"
          fi

          grep -F "Firmware handoff complete" boot.log
          grep -F "Physical memory manager online" boot.log
          grep -F "Kernel heap online" boot.log
          grep -F "Virtual memory ownership established" boot.log
          grep -F "Exception and interrupt gates online" boot.log
          grep -F "System clock online at 100 Hz" boot.log
          grep -F "Userspace address space prepared" boot.log
          grep -F "Capability syscall gateway armed" boot.log
          grep -F "Launching ring-3 init" boot.log
          grep -F "Ring-3 transition verified" boot.log
          grep -F "[  25% ]" boot.log
          grep -F "[  50% ]" boot.log
          grep -F "[  75% ]" boot.log
          grep -F "[ 100% ]" boot.log
          grep -F "Capability IPC roundtrip value=42" boot.log
          grep -F "RAM filesystem mounted bytes=" boot.log
          grep -F "ORYVAEL filesystem handshake complete" boot.log
          grep -F "Init completed with verified preemption" boot.log
          grep -F "Scheduler and recovery console ready" boot.log
          grep -F "ORYVAEL SYSTEM READY" boot.log
          grep -F "ORYVAEL command center" boot.log
          grep -F "System status" boot.log
          grep -F "Debug snapshot" boot.log
          grep -F "privilege.user    CPL3 verified" boot.log
          grep -F "Network status" boot.log
          grep -F "driver             RTL8139" boot.log
          grep -F "dhcp.state         bound" boot.log
          grep -F "ipv4.address       10.0.2.15" boot.log
          grep -F "ssh.service        listening on tcp/22" boot.log
          grep -F "service          enabled" boot.log
          grep -F "authentication   Ed25519 public key only" boot.log
          grep -F "IPv4 configuration" boot.log
          grep -F "address    10.0.2.15" boot.log
          grep -F "reply: source=10.0.2.2" boot.log
          grep -F "Account registry" boot.log
          grep -F "human-administrator" boot.log
          grep -F "name           system" boot.log
          grep -F "Secure shell status" boot.log
          grep -F "AI runtime   not installed" boot.log
          grep -F "password login   disabled" boot.log
          grep -F "ORYVAEL 0.0.2-dev" boot.log
          grep -E 'paging.cr3       0x[0-9a-f]+' boot.log
          grep -E 'userspace.base   0x[0-9a-f]+' boot.log
          grep -F 'init.state       exited' boot.log
          grep -E 'init.preemptions [1-9][0-9]*' boot.log
          grep -F "ramfs: /hello -> ORYVAEL filesystem handshake complete" boot.log
          grep -F "ipc: handle=0x1001 full=0 last_value=42" boot.log
          grep -F "Memory snapshot" boot.log
          grep -E 'uptime: ticks=[1-9][0-9]* seconds=[0-9]+' boot.log
          grep -F "ORYVAEL is a sovereign AI-native operating system." boot.log

      - name: Archive boot image
        uses: actions/upload-artifact@v4
        with:
          name: oryvael-x86_64-uefi
          path: |
            dist/oryvael-x86_64-uefi.img
            dist/BOOTX64.EFI
