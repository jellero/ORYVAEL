      - name: Sign C3 release with ephemeral human root
        run: |
          openssl rand -hex 32 > /tmp/oryvael-human-ci.key
          public_key="$(
            ./target/debug/oryvael approval-public-key \
              --private-key /tmp/oryvael-human-ci.key
          )"

          python - "$public_key" <<'PY'
          import json
          import sys

          public_key = sys.argv[1].strip()
          policy = {
              "version": 1,
              "thresholds": {"c3": 1, "c4": 2},
              "signers": [
                  {
                      "id": "human/ci",
                      "public_key_hex": public_key,
                      "allowed_classes": ["C3"],
                  }
              ],
          }

          with open("/tmp/oryvael-approval-policy.json", "w", encoding="utf-8") as handle:
              json.dump(policy, handle)
          PY

          ./target/debug/oryvael approval-sign \
            --private-key /tmp/oryvael-human-ci.key \
            --signer-id human/ci \
            --context /tmp/oryvael-c3-context.json \
            > /tmp/oryvael-c3-approval.json

          python - <<'PY'
          import json

          with open("/tmp/oryvael-c3-approval.json", "r", encoding="utf-8") as handle:
              approval = json.load(handle)

          with open("/tmp/oryvael-c3-approval-bundle.json", "w", encoding="utf-8") as handle:
              json.dump({"approvals": [approval]}, handle)
