      - name: Build technically eligible audited C3 proof
        run: |
          printf 'ORYVAEL critical release artifact\n' > /tmp/oryvael-c3.img

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          with open("/tmp/oryvael-c3-test-run.json", "r", encoding="utf-8") as handle:
              test_operation = json.load(handle)["operation_id"]
          with open("/tmp/oryvael-c3-security-run.json", "r", encoding="utf-8") as handle:
              security_operation = json.load(handle)["operation_id"]

          artifact_hash = hashlib.sha256(Path("/tmp/oryvael-c3.img").read_bytes()).hexdigest()

          payload = {
              "source": {
                  "repository": "jellero/ORYVAEL",
                  "commit": "critical-approval-demo-source",
                  "tree": None,
              },
              "verifier_runs": [
                  {
                      "audit_log": "/tmp/oryvael-c3-test-control/audit.jsonl",
                      "operation_id": test_operation,
                  },
                  {
                      "audit_log": "/tmp/oryvael-c3-security-control/audit.jsonl",
                      "operation_id": security_operation,
                  },
              ],
              "artifacts": [
                  {
                      "name": "oryvael-c3.img",
                      "sha256": artifact_hash,
                  }
              ],
              "human_approvals": [],
          }

          with open("/tmp/oryvael-c3-proof-input.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          sudo ./target/debug/oryvael proof-build-audited \
            --plan examples/critical-release/c3-plan.json \
            --input /tmp/oryvael-c3-proof-input.json \
            > /tmp/oryvael-c3-proof.json

          python - <<'PY'
          import json

          with open("/tmp/oryvael-c3-proof.json", "r", encoding="utf-8") as handle:
              proof = json.load(handle)

          assert proof["eligible"] is True
          assert proof["change_class"] == "C3"
          assert proof["evidence_verified"] is True
          roles = {item.get("role") for item in proof["verifiers"]}
          assert "test" in roles
          assert "security" in roles
          PY

