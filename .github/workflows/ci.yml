name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trusted-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Validate JSON schemas
        run: |
          for f in spec/*.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Validate architecture contract
        run: cargo run --locked -p oryvael-cli -- arch-check architecture/system.json

      - name: Build locked normalized supply-chain manifest
        run: |
          cargo metadata --locked --format-version 1 > /tmp/oryvael-build-metadata.json
          mkdir -p /tmp/oryvael-demo-build /tmp/oryvael-demo-build-alt
          printf 'same deterministic artifact bytes\n'             > /tmp/oryvael-demo-build/oryvael-demo.img
          cp /tmp/oryvael-demo-build/oryvael-demo.img             /tmp/oryvael-demo-build-alt/oryvael-demo.img

          cargo run --locked -p oryvael-cli -- build-manifest             --plan examples/build/c1-plan.json             --input examples/build/input.json             > /tmp/oryvael-build-manifest-a.json

          cp /tmp/oryvael-build-metadata.json /tmp/oryvael-build-metadata-copy.json
          python - <<'PY'
          import json
          from pathlib import Path

          with open("examples/build/input.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)

          data["cargo_lock"] = str(Path("Cargo.lock").resolve())
          data["cargo_metadata"] = "/tmp/oryvael-build-metadata-copy.json"
          data["artifacts"][0]["path"] = "/tmp/oryvael-demo-build-alt/oryvael-demo.img"

          with open("/tmp/oryvael-build-input-alt.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle)
          PY

          cargo run --locked -p oryvael-cli -- build-manifest             --plan examples/build/c1-plan.json             --input /tmp/oryvael-build-input-alt.json             > /tmp/oryvael-build-manifest-b.json

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          with open("/tmp/oryvael-build-manifest-a.json", "r", encoding="utf-8") as handle:
              first = json.load(handle)
          with open("/tmp/oryvael-build-manifest-b.json", "r", encoding="utf-8") as handle:
              second = json.load(handle)

          assert first["version"] == "oryvael-build-manifest/2"
          assert first["manifest_sha256"] == second["manifest_sha256"]
          assert first["normalized_input_sha256"] == second["normalized_input_sha256"]
          assert first["cargo_lock_sha256"] == hashlib.sha256(
              Path("Cargo.lock").read_bytes()
          ).hexdigest()
          assert first["sbom"]["format"] == "oryvael-sbom/2"
          assert len(first["sbom"]["sha256"]) == 64

          components = first["sbom"]["components"]
          by_id = {component["id"]: component for component in components}
          assert "workspace:oryvael-build@0.1.0" in by_id
          serde = [
              component for component in components
              if component["name"] == "serde" and component["workspace"] is False
          ]
          assert len(serde) == 1
          assert serde[0]["version"] == "1.0.229"
          assert serde[0]["checksum"]
          assert all(
              not component["id"].startswith("workspace:/")
              for component in components
          )

          encoded = json.dumps(first, sort_keys=True)
          assert "/tmp/oryvael-demo-build" not in encoded
          assert "/home/runner/" not in encoded
          PY

      - name: Verify AI cannot inject a declared dependency list
        run: |
          python - <<'PY'
          import json

          with open("examples/build/input.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)

          data["dependencies"] = [
              {
                  "name": "fake-clean-sbom",
                  "version": "1.0.0",
                  "source": "ai-declared",
              }
          ]

          with open("/tmp/oryvael-build-input-injected.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle)
          PY

          set +e
          cargo run --locked -p oryvael-cli -- build-manifest             --plan examples/build/c1-plan.json             --input /tmp/oryvael-build-input-injected.json
          status=$?
          set -e
          test "$status" -ne 0

      - name: Build eligible C2 proof package
        run: |
          cargo run --locked -p oryvael-cli -- proof-build \
            --plan examples/proof/c2-plan.json \
            --evidence examples/proof/c2-evidence.json \
            > /tmp/oryvael-proof.json

          python - <<'PY'
          import json

          with open("/tmp/oryvael-proof.json", "r", encoding="utf-8") as handle:
              proof = json.load(handle)

          assert proof["eligible"] is True
          assert proof["eligibility_reasons"] == []
          assert proof["change_id"] == "CHG-PROOF-DEMO-001"
          principals = {item["principal"] for item in proof["verifiers"]}
          assert "test-ai/proof-demo" in principals
          assert "security-ai/proof-demo" in principals
          PY

      - name: Verify producer cannot satisfy independent C2 verification
        run: |
          python - <<'PY'
          import json

          with open("examples/proof/c2-evidence.json", "r", encoding="utf-8") as handle:
              evidence = json.load(handle)

          evidence["verifiers"][0]["principal"] = "developer-ai/proof-demo"

          with open("/tmp/oryvael-ineligible-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle)
          PY

          set +e
          cargo run --locked -p oryvael-cli -- proof-build \
            --plan examples/proof/c2-plan.json \
            --evidence /tmp/oryvael-ineligible-evidence.json \
            > /tmp/oryvael-ineligible-proof.json
          status=$?
          set -e
          test "$status" -eq 4

          python - <<'PY'
          import json

          with open("/tmp/oryvael-ineligible-proof.json", "r", encoding="utf-8") as handle:
              proof = json.load(handle)

          assert proof["eligible"] is False
          assert any(
              "test is not independent from producer" in reason
              for reason in proof["eligibility_reasons"]
          )
          PY

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux

      - name: Build ORYVAEL CLI
        run: cargo build --locked -p oryvael-cli

      - name: Report rootless host capability
        run: |
          set +e
          ./target/debug/oryvael supervisor-doctor
          status=$?
          set -e
          echo "rootless_preflight_exit=$status"

      - name: Trusted service preflight
        run: sudo ./target/debug/oryvael supervisor-doctor

      - name: Run real confinement demo
        run: |
          rm -rf /tmp/oryvael-demo-workspace /tmp/oryvael-demo-control
          sudo ./target/debug/oryvael supervise \
            --principal examples/supervisor/developer-principal.json \
            --job examples/supervisor/job.json

      - name: Verify filesystem and network confinement
        run: |
          test -f /tmp/oryvael-demo-workspace/generated.txt
          test "$(cat /tmp/oryvael-demo-workspace/generated.txt)" = "ORYVAEL sandbox OK"
          test ! -e /oryvael-escape

      - name: Verify AI cannot self-grant network
        run: |
          python - <<'PY'
          import json

          with open("examples/supervisor/job.json", "r", encoding="utf-8") as handle:
              job = json.load(handle)

          job["network"] = "host"
          job["audit_log"] = "/tmp/oryvael-network-denied-control/audit.jsonl"
          job["artifact_store"] = "/tmp/oryvael-network-denied-control/artifacts"

          with open("/tmp/oryvael-network-denied-job.json", "w", encoding="utf-8") as handle:
              json.dump(job, handle)
          PY

          set +e
          sudo ./target/debug/oryvael supervise \
            --principal examples/supervisor/developer-principal.json \
            --job /tmp/oryvael-network-denied-job.json
          status=$?
          set -e
          test "$status" -ne 0

          ./target/debug/oryvael audit-verify \
            /tmp/oryvael-network-denied-control/audit.jsonl

          python - <<'PY'
          import json

          with open("/tmp/oryvael-network-denied-control/audit.jsonl", "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          denied = [
              record["event"]
              for record in records
              if record["event"]["action"] == "policy.evaluate"
              and record["event"]["decision"] == "denied"
              and record["event"]["metadata"].get("resource") == "network"
          ]
          assert denied, "expected a denied network capability decision"
          PY

      - name: Verify control files cannot be worker-writable
        run: |
          sudo cp examples/supervisor/job.json \
            /tmp/oryvael-demo-workspace/self-modifiable-job.json

          set +e
          sudo ./target/debug/oryvael supervise \
            --principal examples/supervisor/developer-principal.json \
            --job /tmp/oryvael-demo-workspace/self-modifiable-job.json
          status=$?
          set -e
          test "$status" -ne 0

      - name: Verify supervisor audit chain
        run: |
          ./target/debug/oryvael audit-verify /tmp/oryvael-demo-control/audit.jsonl
          python - <<'PY'
          import json

          with open("/tmp/oryvael-demo-control/audit.jsonl", "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          assert records, "audit journal is empty"
          events = [record["event"] for record in records]
          assert all(event.get("operation_id") for event in events)

          actions = {event["action"] for event in events}
          required = {
              "supervisor.run.request",
              "policy.evaluate",
              "supervisor.sandbox.start",
              "supervisor.sandbox.exit",
          }
          missing = required - actions
          assert not missing, f"missing audit actions: {sorted(missing)}"
          PY

      - name: Prepare Git workspace broker source repository
        run: |
          sudo rm -rf \
            /tmp/oryvael-workspace-source \
            /tmp/oryvael-worktrees \
            /tmp/oryvael-workspace-control \
            /tmp/oryvael-workspace-denied-control
          sudo mkdir -p /tmp/oryvael-workspace-source
          sudo git -C /tmp/oryvael-workspace-source init -b main
          echo "workspace broker seed" | sudo tee /tmp/oryvael-workspace-source/README.md >/dev/null
          sudo git -C /tmp/oryvael-workspace-source config user.email "oryvael-ci@example.invalid"
          sudo git -C /tmp/oryvael-workspace-source config user.name "ORYVAEL CI"
          sudo git -C /tmp/oryvael-workspace-source add README.md
          sudo git -C /tmp/oryvael-workspace-source commit -m "seed workspace broker"

      - name: Provision policy-bound Git worktree
        run: |
          sudo ./target/debug/oryvael workspace-create \
            --principal examples/workspace/developer-principal.json \
            --registry examples/workspace/registry.json \
            --request examples/workspace/request.json \
            > /tmp/oryvael-workspace-result.json

      - name: Verify generated worktree branch and audit
        run: |
          target=/tmp/oryvael-worktrees/CHG-WORKSPACE-DEMO-001
          test -d "$target"
          test -f "$target/README.md"
          test "$(sudo git -C "$target" branch --show-current)" = "oryvael/CHG-WORKSPACE-DEMO-001"

          source_commit="$(sudo git -C /tmp/oryvael-workspace-source rev-parse HEAD)"
          worktree_commit="$(sudo git -C "$target" rev-parse HEAD)"
          test "$source_commit" = "$worktree_commit"

          sudo ./target/debug/oryvael audit-verify \
            /tmp/oryvael-workspace-control/audit.jsonl

          python - <<'PY'
          import json

          with open("/tmp/oryvael-workspace-result.json", "r", encoding="utf-8") as handle:
              result = json.load(handle)

          assert result["repository_id"] == "oryvael-demo"
          assert result["workspace"] == "/tmp/oryvael-worktrees/CHG-WORKSPACE-DEMO-001"
          assert result["branch"] == "oryvael/CHG-WORKSPACE-DEMO-001"
          assert len(result["base_commit"]) >= 40

          with open("/tmp/oryvael-workspace-control/audit.jsonl", "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          events = [record["event"] for record in records]
          assert all(event.get("operation_id") for event in events)

          allowed = {
              (
                  event["metadata"].get("resource"),
                  event["metadata"].get("action"),
                  event["target"],
              )
              for event in events
              if event["action"] == "policy.evaluate"
              and event["decision"] == "allowed"
          }

          assert ("repository", "read", "oryvael-demo") in allowed
          assert (
              "workspace",
              "provision",
              "/tmp/oryvael-worktrees/CHG-WORKSPACE-DEMO-001",
          ) in allowed
          assert (
              "git_branch",
              "create",
              "oryvael/CHG-WORKSPACE-DEMO-001",
          ) in allowed
          PY

      - name: Verify branch authority cannot be self-granted
        run: |
          python - <<'PY'
          import json

          with open("examples/workspace/developer-principal.json", "r", encoding="utf-8") as handle:
              principal = json.load(handle)
          principal["grants"] = [
              grant for grant in principal["grants"]
              if grant["resource"] != "git_branch"
          ]
          with open("/tmp/oryvael-workspace-no-branch-principal.json", "w", encoding="utf-8") as handle:
              json.dump(principal, handle)

          with open("examples/workspace/change-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)
          plan["id"] = "CHG-WORKSPACE-DENIED-001"
          with open("/tmp/oryvael-workspace-denied-plan.json", "w", encoding="utf-8") as handle:
              json.dump(plan, handle)

          with open("examples/workspace/request.json", "r", encoding="utf-8") as handle:
              request = json.load(handle)
          request["change_id"] = "CHG-WORKSPACE-DENIED-001"
          request["change_plan"] = "/tmp/oryvael-workspace-denied-plan.json"
          request["audit_log"] = "/tmp/oryvael-workspace-denied-control/audit.jsonl"
          with open("/tmp/oryvael-workspace-denied-request.json", "w", encoding="utf-8") as handle:
              json.dump(request, handle)
          PY

          set +e
          sudo ./target/debug/oryvael workspace-create \
            --principal /tmp/oryvael-workspace-no-branch-principal.json \
            --registry examples/workspace/registry.json \
            --request /tmp/oryvael-workspace-denied-request.json
          status=$?
          set -e

          test "$status" -ne 0
          test ! -e /tmp/oryvael-worktrees/CHG-WORKSPACE-DENIED-001

          sudo ./target/debug/oryvael audit-verify \
            /tmp/oryvael-workspace-denied-control/audit.jsonl

          python - <<'PY'
          import json

          with open("/tmp/oryvael-workspace-denied-control/audit.jsonl", "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          denied = [
              record["event"]
              for record in records
              if record["event"]["action"] == "policy.evaluate"
              and record["event"]["decision"] == "denied"
              and record["event"]["metadata"].get("resource") == "git_branch"
          ]
          assert denied, "expected git_branch.create denial"
          PY

      - name: Prepare brokered development workspace
        run: |
          sudo rm -rf /tmp/oryvael-tool-demo-workspace /tmp/oryvael-tool-demo-control
          sudo mkdir -p /tmp/oryvael-tool-demo-workspace
          sudo cp -R examples/tool-broker/workspace/. /tmp/oryvael-tool-demo-workspace/

      - name: Run capability-bound tool
        run: |
          set +e
          sudo ./target/debug/oryvael tool-run \
            --principal examples/tool-broker/developer-principal.json \
            --catalog examples/tool-broker/catalog.json \
            --invocation examples/tool-broker/invocation.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "--- brokered tool stderr ---"
            sudo cat /tmp/oryvael-tool-demo-workspace/.oryvael/runtime/*.stderr || true
            exit "$status"
          fi

      - name: Verify brokered action and audit binding
        run: |
          find /tmp/oryvael-tool-demo-workspace -path '*/__pycache__/*.pyc' -print -quit | grep -q .
          ./target/debug/oryvael audit-verify /tmp/oryvael-tool-demo-control/audit.jsonl

          python - <<'PY'
          import json

          with open("/tmp/oryvael-tool-demo-control/audit.jsonl", "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          events = [record["event"] for record in records]
          tool_allows = [
              event for event in events
              if event["action"] == "policy.evaluate"
              and event["decision"] == "allowed"
              and event["target"] == "python.syntax-check"
              and event["metadata"].get("resource") == "tool"
          ]
          assert tool_allows, "missing allowed tool.execute decision"

          requests = [event for event in events if event["action"] == "supervisor.run.request"]
          assert requests, "missing brokered run request"
          metadata = requests[-1]["metadata"]
          assert metadata.get("context.broker") == "oryvael-tool-broker"
          assert metadata.get("context.tool") == "python"
          assert metadata.get("context.tool_action") == "syntax-check"
          assert len(metadata.get("context.change_plan_sha256", "")) == 64
          assert len(metadata.get("context.tool_catalog_sha256", "")) == 64
          assert len(metadata.get("context.tool_invocation_sha256", "")) == 64
          PY

      - name: Run independent Test AI verifier
        run: |
          sudo rm -rf /tmp/oryvael-tool-test-control
          sudo ./target/debug/oryvael tool-run \
            --principal examples/tool-broker/test-principal.json \
            --catalog examples/tool-broker/catalog.json \
            --invocation examples/tool-broker/test-invocation.json \
            > /tmp/oryvael-test-tool-result.json

      - name: Derive verifier evidence from audited execution
        run: |
          operation_id="$(python - <<'PY'
          import json
          with open("/tmp/oryvael-test-tool-result.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["operation_id"])
          PY
          )"

          sudo ./target/debug/oryvael evidence-extract \
            --audit /tmp/oryvael-tool-test-control/audit.jsonl \
            --operation-id "$operation_id" \
            > /tmp/oryvael-verified-evidence.json

          python - <<'PY'
          import json

          with open("/tmp/oryvael-verified-evidence.json", "r", encoding="utf-8") as handle:
              evidence = json.load(handle)

          assert evidence["change_id"] == "CHG-TOOL-DEMO-001"
          assert evidence["name"] == "python.syntax-check"
          assert evidence["principal"] == "test-ai/tool-demo"
          assert evidence["role"] == "test"
          assert evidence["status"] == "pass"
          assert len(evidence["change_plan_sha256"]) == 64
          assert len(evidence["evidence_hash"]) == 64
          assert evidence["operation_id"]
          PY

      - name: Verify tampered audit cannot produce evidence
        run: |
          sudo cp /tmp/oryvael-tool-test-control/audit.jsonl /tmp/oryvael-tampered-audit.jsonl
          sudo python - <<'PY'
          import json

          path = "/tmp/oryvael-tampered-audit.jsonl"
          with open(path, "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          records[-1]["event"]["metadata"]["exit_code"] = "99"

          with open(path, "w", encoding="utf-8") as handle:
              for record in records:
                  handle.write(json.dumps(record, separators=(",", ":")) + "\n")
          PY

          operation_id="$(python - <<'PY'
          import json
          with open("/tmp/oryvael-test-tool-result.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["operation_id"])
          PY
          )"

          set +e
          sudo ./target/debug/oryvael evidence-extract \
            --audit /tmp/oryvael-tampered-audit.jsonl \
            --operation-id "$operation_id"
          status=$?
          set -e
          test "$status" -ne 0

      - name: Run C2 verifier for audited proof gate
        run: |
          sudo rm -rf /tmp/oryvael-audited-proof-control
          sudo ./target/debug/oryvael tool-run \
            --principal examples/tool-broker/test-principal.json \
            --catalog examples/tool-broker/catalog.json \
            --invocation examples/audited-proof/test-invocation.json \
            > /tmp/oryvael-audited-proof-run.json

      - name: Build release-grade audited C2 proof
        run: |
          printf 'ORYVAEL audited release artifact\n' > /tmp/audited-proof-demo.img

          operation_id="$(python - <<'PY'
          import json
          with open("/tmp/oryvael-audited-proof-run.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["operation_id"])
          PY
          )"

          python - "$operation_id" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          operation_id = sys.argv[1]
          artifact_hash = hashlib.sha256(
              Path("/tmp/audited-proof-demo.img").read_bytes()
          ).hexdigest()
          payload = {
              "source": {
                  "repository": "jellero/ORYVAEL",
                  "commit": "audited-proof-demo-source",
                  "tree": None,
              },
              "verifier_runs": [
                  {
                      "audit_log": "/tmp/oryvael-audited-proof-control/audit.jsonl",
                      "operation_id": operation_id,
                  }
              ],
              "artifacts": [
                  {
                      "name": "audited-proof-demo.img",
                      "sha256": artifact_hash,
                  }
              ],
              "human_approvals": [],
          }

          with open("/tmp/oryvael-audited-proof-input.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          sudo ./target/debug/oryvael proof-build-audited \
            --plan examples/audited-proof/c2-plan.json \
            --input /tmp/oryvael-audited-proof-input.json \
            > /tmp/oryvael-audited-proof.json

          python - <<'PY'
          import json

          with open("/tmp/oryvael-audited-proof.json", "r", encoding="utf-8") as handle:
              proof = json.load(handle)

          assert proof["eligible"] is True
          assert proof["evidence_verified"] is True
          assert len(proof["change_plan_sha256"]) == 64
          assert proof["eligibility_reasons"] == []
          assert len(proof["verifiers"]) == 1

          verifier = proof["verifiers"][0]
          assert verifier["name"] == "python.syntax-check"
          assert verifier["principal"] == "test-ai/tool-demo"
          assert verifier["status"] == "pass"
          assert len(verifier["evidence_hash"]) == 64
          PY

      - name: Verify audited evidence cannot be replayed against modified plan
        run: |
          python - <<'PY'
          import json

          with open("examples/audited-proof/c2-plan.json", "r", encoding="utf-8") as handle:
              plan = json.load(handle)

          plan["intent"] = "Modified plan bytes after verifier execution"

          with open("/tmp/oryvael-modified-audited-plan.json", "w", encoding="utf-8") as handle:
              json.dump(plan, handle, indent=2)
              handle.write("\n")
          PY

          set +e
          sudo ./target/debug/oryvael proof-build-audited \
            --plan /tmp/oryvael-modified-audited-plan.json \
            --input /tmp/oryvael-audited-proof-input.json \
            > /tmp/oryvael-replayed-proof.json
          status=$?
          set -e
          test "$status" -eq 4

          python - <<'PY'
          import json

          with open("/tmp/oryvael-replayed-proof.json", "r", encoding="utf-8") as handle:
              proof = json.load(handle)

          assert proof["eligible"] is False
          assert proof["evidence_verified"] is True
          assert any(
              "change-plan hash does not match evaluated plan" in reason
              for reason in proof["eligibility_reasons"]
          )
          PY

      - name: Approve audited artifact for canary release
        run: |
          sudo ./target/debug/oryvael release-check \
            --plan examples/audited-proof/c2-plan.json \
            --input /tmp/oryvael-audited-proof-input.json \
            --artifact-name audited-proof-demo.img \
            --artifact /tmp/audited-proof-demo.img \
            --ring canary \
            > /tmp/oryvael-release-decision.json

          python - <<'PY'
          import json

          with open("/tmp/oryvael-release-decision.json", "r", encoding="utf-8") as handle:
