name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trusted-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: rustc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Validate JSON schemas
        run: |
          for f in spec/*.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Validate architecture contract
        run: cargo run -p oryvael-cli -- arch-check architecture/system.json

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux

      - name: Supervisor host preflight
        run: cargo run -p oryvael-cli -- supervisor-doctor

      - name: Run real confinement demo
        run: |
          rm -rf /tmp/oryvael-demo-workspace /tmp/oryvael-demo-control
          set +e
          cargo run -p oryvael-cli -- supervise \
            --principal examples/supervisor/developer-principal.json \
            --job examples/supervisor/job.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "--- sandbox stderr ---"
            cat /tmp/oryvael-demo-workspace/.oryvael/runtime/*.stderr || true
            exit "$status"
          fi

      - name: Verify filesystem confinement
        run: |
          test -f /tmp/oryvael-demo-workspace/generated.txt
          test "$(cat /tmp/oryvael-demo-workspace/generated.txt)" = "ORYVAEL sandbox OK"
          test ! -e /oryvael-escape

      - name: Verify audit chain
        run: |
          cargo run -p oryvael-cli -- audit-verify /tmp/oryvael-demo-control/audit.jsonl
          python - <<'PY'
          import json

          path = "/tmp/oryvael-demo-control/audit.jsonl"
          with open(path, "r", encoding="utf-8") as handle:
              records = [json.loads(line) for line in handle if line.strip()]

          assert records, "audit journal is empty"
          events = [record["event"] for record in records]
          assert all(event.get("operation_id") for event in events)

          actions = {event["action"] for event in events}
          required = {
              "supervisor.run.request",
              "policy.evaluate",
              "supervisor.sandbox.start",
              "supervisor.sandbox.exit",
          }
          missing = required - actions
          assert not missing, f"missing audit actions: {sorted(missing)}"
          PY
